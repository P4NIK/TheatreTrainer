# Baut die Seite und veröffentlicht sie auf GitHub Pages.
#
# Es gibt nichts zu betreiben: gebaut wird hier, ausgeliefert wird eine
# statische Seite. Der `--base`-Schalter kommt aus dem Repository-Namen, weil
# das Projekt unter github.io/<name>/ liegt und nicht unter der Wurzel.
name: Seite veröffentlichen

on:
  push:
    branches: [main]
  # Damit sich auch aus einem Zweig heraus veröffentlichen lässt.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Zwei Läufe gleichzeitig würden sich gegenseitig überholen.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` holt dabei auch die WASM-Dateien nach public/wasm/ – das
      # erledigt das postinstall-Skript fetch-wasm.mjs.
      - run: npm ci
        working-directory: frontend

      - run: npm test
        working-directory: frontend

      - run: npm run build -- --base=/${{ github.event.repository.name }}/
        working-directory: frontend

      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
